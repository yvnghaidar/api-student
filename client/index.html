<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Student API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-light p-5">
    <div class="container bg-white p-4 rounded shadow-sm">
        <h2 class="mb-4 text-center">Data Mahasiswa (Axios Client)</h2>
        
        <div class="card mb-4">
            <div class="card-header bg-primary text-white" id="formTitle">Tambah Mahasiswa Baru</div>
            <div class="card-body">
                <form id="studentForm">
                    <input type="hidden" id="studentId">
                    <div class="row mb-3">
                        <div class="col"><input type="text" id="nim" class="form-control" placeholder="NIM" required></div>
                        <div class="col"><input type="text" id="name" class="form-control" placeholder="Nama Lengkap" required></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col"><input type="text" id="major" class="form-control" placeholder="Jurusan" required></div>
                        <div class="col"><input type="number" id="batch_year" class="form-control" placeholder="Tahun Angkatan" required></div>
                    </div>
                    <button type="submit" class="btn btn-success w-100" id="btnSubmit">Simpan Data (POST)</button>
                </form>
            </div>
        </div>

        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>NIM</th>
                    <th>Nama</th>
                    <th>Jurusan</th>
                    <th>Angkatan</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
                </tbody>
        </table>
    </div>

    <script>
        const apiUrl = 'http://127.0.0.1:8000/api/v1/students';

        function fetchStudents() {
            axios.get(apiUrl)
                .then(response => {
                    const students = response.data;
                    let tableBody = '';
                    students.forEach(student => {
                        tableBody += `
                            <tr>
                                <td>${student.nim}</td>
                                <td>${student.name}</td>
                                <td>${student.major}</td>
                                <td>${student.batch_year}</td>
                                <td>
                                    <button class="btn btn-sm btn-warning" onclick="editStudent(${student.id}, '${student.nim}', '${student.name}', '${student.major}', ${student.batch_year})">Edit (UPDATE)</button>
                                </td>
                            </tr>
                        `;
                    });
                    document.getElementById('studentTableBody').innerHTML = tableBody;
                })
                .catch(error => console.error('Error fetching data:', error));
        }

        document.getElementById('studentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const id = document.getElementById('studentId').value;
            const studentData = {
                nim: document.getElementById('nim').value,
                name: document.getElementById('name').value,
                major: document.getElementById('major').value,
                batch_year: document.getElementById('batch_year').value
            };

            if (id) {
                axios.put(`${apiUrl}/${id}`, studentData)
                    .then(response => {
                        alert('Data berhasil di-update!');
                        resetForm();
                        fetchStudents();
                    })
                    .catch(error => alert('Gagal update data. Cek console.'));
            } else {
                axios.post(apiUrl, studentData)
                    .then(response => {
                        alert('Data berhasil ditambahkan!');
                        resetForm();
                        fetchStudents();
                    })
                    .catch(error => alert('Gagal tambah data. Pastikan NIM tidak duplikat.'));
            }
        });

        function editStudent(id, nim, name, major, batch_year) {
            document.getElementById('studentId').value = id;
            document.getElementById('nim').value = nim;
            document.getElementById('name').value = name;
            document.getElementById('major').value = major;
            document.getElementById('batch_year').value = batch_year;
            
            document.getElementById('formTitle').innerText = "Update Mahasiswa (Mode Edit)";
            document.getElementById('btnSubmit').innerText = "Update Data (PUT)";
            document.getElementById('btnSubmit').className = "btn btn-warning w-100";
        }

        function resetForm() {
            document.getElementById('studentId').value = '';
            document.getElementById('nim').value = '';
            document.getElementById('name').value = '';
            document.getElementById('major').value = '';
            document.getElementById('batch_year').value = '';
            
            document.getElementById('formTitle').innerText = "Tambah Mahasiswa Baru";
            document.getElementById('btnSubmit').innerText = "Simpan Data (POST)";
            document.getElementById('btnSubmit').className = "btn btn-success w-100";
        }
        fetchStudents();
    </script>
</body>
</html>
